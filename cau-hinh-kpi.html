<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cấu hình KPI | IOC Kinh tế số & Tài chính số tỉnh Điện Biên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#161D31">
  <link rel="apple-touch-icon" href="./assets/img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IOC">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="cau-hinh-kpi">
<div class="layout-wrapper">
  <aside class="layout-sidebar" id="sidebar"></aside>

  <div class="layout-page">
    <nav class="navbar" id="navbar"></nav>

    <main class="content">
      <div class="page-head">
        <h1 class="page-title">Cấu hình KPI</h1>
        <div class="page-breadcrumb">
          <a href="index.html">IOC</a><span class="sep">/</span>Hệ thống<span class="sep">/</span><span class="current">Cấu hình KPI</span>
        </div>
      </div>

      <div class="row" id="statRow"></div>

      <div class="row">
        <div class="card col-12">
          <div class="card-header">
            <div>
              <div class="card-title">Bộ chỉ tiêu điều hành</div>
              <div class="card-subtitle">Dashboard hiển thị theo cấu hình — bật/tắt để thay đổi chỉ tiêu được theo dõi</div>
            </div>
            <button class="btn btn-primary btn-sm"><i class="ri-add-line"></i>Thêm chỉ tiêu</button>
          </div>
          <div class="card-body no-pad table-wrap" style="padding-top:14px">
            <table class="table">
              <thead>
                <tr>
                  <th>Mã</th>
                  <th style="min-width:240px">Tên chỉ tiêu</th>
                  <th>Nhóm</th>
                  <th>Đơn vị tính</th>
                  <th>Ngưỡng cảnh báo</th>
                  <th>Tần suất cập nhật</th>
                  <th>Hiển thị</th>
                </tr>
              </thead>
              <tbody id="tblKpi"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  var D = window.IOC_DATA, IOC = window.IOC;

  document.getElementById("statRow").innerHTML =
    IOC.statCard({ col: "col-4", icon: "ri-dashboard-3-line", tint: "tint-primary", badge: "+5", value: "86", unit: "chỉ tiêu", label: "Tổng chỉ tiêu định nghĩa", note: "Trong bộ KPI điều hành" }) +
    IOC.statCard({ col: "col-4", icon: "ri-eye-line", tint: "tint-success", badge: "74,4%", badgeClass: "badge-success", value: "64", unit: "chỉ tiêu", label: "Đang hiển thị trên dashboard", note: "Tỷ lệ so tổng chỉ tiêu" }) +
    IOC.statCard({ col: "col-4", icon: "ri-alarm-warning-line", tint: "tint-warning", value: "41", unit: "chỉ tiêu", label: "Có ngưỡng cảnh báo", note: "Sinh cảnh báo tự động" });

  document.getElementById("tblKpi").innerHTML = D.kpiConfig.map(function (x, i) {
    return "<tr>" +
      '<td class="td-main" style="white-space:nowrap">' + x.ma + "</td>" +
      '<td class="td-main">' + x.ten + "</td>" +
      "<td>" + IOC.badgeDomain(x.domain) + "</td>" +
      "<td>" + x.donViTinh + "</td>" +
      '<td style="white-space:nowrap">' + x.nguong + "</td>" +
      "<td>" + x.tanSuat + "</td>" +
      '<td><label class="switch"><input type="checkbox"' + (x.hienThi ? " checked" : "") + '><span class="slider"></span></label></td>' +
      "</tr>";
  }).join("");
})();
</script>
</body>
</html>
