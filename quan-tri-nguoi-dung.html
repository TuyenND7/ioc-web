<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị người dùng | IOC Kinh tế số & Tài chính số tỉnh Điện Biên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#161D31">
  <link rel="apple-touch-icon" href="./assets/img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IOC">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="quan-tri-nguoi-dung">
<div class="layout-wrapper">
  <aside class="layout-sidebar" id="sidebar"></aside>

  <div class="layout-page">
    <nav class="navbar" id="navbar"></nav>

    <main class="content">
      <div class="page-head">
        <h1 class="page-title">Quản trị người dùng</h1>
        <div class="page-breadcrumb">
          <a href="index.html">IOC</a><span class="sep">/</span>Hệ thống<span class="sep">/</span><span class="current">Quản trị người dùng</span>
        </div>
      </div>

      <div class="row" id="statRow"></div>

      <div class="row">
        <div class="card col-12">
          <div class="card-header">
            <div>
              <div class="card-title">Danh sách người dùng</div>
              <div class="card-subtitle">Tài khoản truy cập hệ thống IOC theo vai trò và đơn vị</div>
            </div>
            <button class="btn btn-primary btn-sm"><i class="ti ti-plus"></i>Thêm người dùng</button>
          </div>
          <div class="card-body no-pad table-wrap" style="padding-top:14px">
            <table class="table">
              <thead>
                <tr>
                  <th style="min-width:220px">Người dùng</th>
                  <th>Đơn vị</th>
                  <th>Vai trò</th>
                  <th>Trạng thái</th>
                  <th>Đăng nhập gần nhất</th>
                </tr>
              </thead>
              <tbody id="tblUser"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  var D = window.IOC_DATA, IOC = window.IOC;

  document.getElementById("statRow").innerHTML =
    IOC.statCard({ col: "col-4", icon: "ti ti-users", tint: "tint-primary", badge: "+12", value: "248", unit: "tài khoản", label: "Tổng người dùng", note: "So với quý trước" }) +
    IOC.statCard({ col: "col-4", icon: "ti ti-user-check", tint: "tint-success", badge: "93,1%", badgeClass: "badge-success", value: "231", unit: "tài khoản", label: "Đang hoạt động", note: "Đăng nhập trong 30 ngày" }) +
    IOC.statCard({ col: "col-4", icon: "ti ti-user-plus", tint: "tint-warning", badge: "+3", dir: "down", value: "7", unit: "tài khoản", label: "Chờ phê duyệt", note: "Yêu cầu mới trong tuần" });

  var tints = ["tint-primary", "tint-info", "tint-warning", "tint-success", "tint-danger", "tint-secondary"];

  document.getElementById("tblUser").innerHTML = D.nguoiDung.map(function (x, i) {
    var trangThai = x.online
      ? '<span class="status-cell"><span class="status-dot on"></span>Trực tuyến</span>'
      : '<span class="status-cell"><span class="status-dot"></span>Ngoại tuyến</span>';
    return "<tr>" +
      '<td><div style="display:flex;align-items:center;gap:12px">' +
      '<span class="avatar sm ' + tints[i % tints.length] + '">' + IOC.initials(x.ten) + "</span>" +
      '<div><div class="td-main">' + x.ten + '</div><div class="td-sub">' + x.donVi + "</div></div></div></td>" +
      "<td>" + x.donVi + "</td>" +
      "<td>" + IOC.badgeTrangThai(x.vaiTro) + "</td>" +
      "<td>" + trangThai + "</td>" +
      '<td style="white-space:nowrap">' + x.lanCuoi + "</td>" +
      "</tr>";
  }).join("");
})();
</script>
</body>
</html>
