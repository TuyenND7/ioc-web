<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh tra / Kiểm toán | IOC Kinh tế số & Tài chính số tỉnh Điện Biên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#666CFF">
  <link rel="apple-touch-icon" href="./assets/img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IOC">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="thanh-tra">
<div class="layout-wrapper">
  <aside class="layout-sidebar" id="sidebar"></aside>

  <div class="layout-page">
    <nav class="navbar" id="navbar"></nav>

    <main class="content">
      <div class="page-head">
        <h1 class="page-title">Thanh tra / Kiểm toán</h1>
        <div class="page-breadcrumb">
          <a href="index.html">IOC</a><span class="sep">/</span>Nghiệp vụ<span class="sep">/</span><span class="current">Thanh tra / Kiểm toán</span>
        </div>
      </div>

      <div class="row" id="statRow"></div>

      <div class="row">
        <div class="card col-12">
          <div class="card-header">
            <div>
              <div class="card-title">Xử lý kiến nghị sau thanh tra, kiểm toán theo quý</div>
              <div class="card-subtitle">Năm 2026 · số kiến nghị đã xử lý so với còn tồn</div>
            </div>
            <button class="card-menu-btn" aria-label="Tùy chọn"><i class="ri-more-2-line"></i></button>
          </div>
          <div class="card-body">
            <div id="chartThanhTraQuy" class="chart-box"></div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="card col-12">
          <div class="card-header">
            <div>
              <div class="card-title">Các cuộc thanh tra, kiểm toán</div>
              <div class="card-subtitle">10 cuộc trong kế hoạch năm 2026</div>
            </div>
            <button class="btn btn-outline btn-sm"><i class="ri-download-2-line"></i>Xuất báo cáo</button>
          </div>
          <div class="card-body no-pad table-wrap" style="padding-top:14px">
            <table class="table">
              <thead>
                <tr>
                  <th style="width:42px">#</th>
                  <th style="min-width:280px">Cuộc thanh tra / kiểm toán</th>
                  <th>Đối tượng</th>
                  <th>Lĩnh vực</th>
                  <th>Trạng thái</th>
                  <th style="width:220px">% xử lý kiến nghị</th>
                </tr>
              </thead>
              <tbody id="tblThanhTra"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/charts.js"></script>
<script>
(function () {
  var D = window.IOC_DATA, IOC = window.IOC;

  document.getElementById("statRow").innerHTML =
    IOC.statCard({ icon: "ri-search-eye-line", tint: "tint-primary", badge: "+6", value: "42", unit: "cuộc", label: "Cuộc thanh tra năm nay", note: "So với cùng kỳ 2025" }) +
    IOC.statCard({ icon: "ri-loader-4-line", tint: "tint-info", value: "9", unit: "cuộc", label: "Đang tiến hành", note: "Theo kế hoạch năm" }) +
    IOC.statCard({ icon: "ri-file-text-line", tint: "tint-success", badge: "+4", value: "28", unit: "kết luận", label: "Kết luận đã ban hành", note: "Trong quý này" }) +
    IOC.statCard({ icon: "ri-error-warning-line", tint: "tint-danger", badge: "+23", dir: "down", value: "64", unit: "kiến nghị", label: "Kiến nghị chưa xử lý", note: "Tăng so với quý trước" });

  document.getElementById("tblThanhTra").innerHTML = D.thanhTra.cuocThanhTra.map(function (x, i) {
    var progress;
    if (x.trangThai === "dang tien hanh" || x.trangThai === "cho ket luan") {
      progress = '<span style="color:var(--text-faint)">— chưa có kết luận</span>';
    } else {
      progress = '<div class="progress-cell"><div class="progress"><div class="progress-bar ' + IOC.progressClass(x.xuLy) + '" style="width:' + x.xuLy + '%"></div></div><span class="pct">' + x.xuLy + "%</span></div>";
    }
    return "<tr>" +
      '<td style="color:var(--text-faint)">' + (i + 1) + "</td>" +
      '<td class="td-main">' + x.ten + "</td>" +
      "<td>" + x.doiTuong + "</td>" +
      "<td>" + x.linhVuc + "</td>" +
      "<td>" + IOC.badgeTrangThai(x.trangThai) + "</td>" +
      "<td>" + progress + "</td>" +
      "</tr>";
  }).join("");
})();
</script>
</body>
</html>
